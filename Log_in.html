<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuarezBus - Login/Sign in</title>
        <link rel="shortcut icon" href="images/JuarezBus_logo.webp">
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="logo">
            <img id="juarezbus_logo" src="images/JuarezBus_logo.webp" alt="">
        </div>
    </header>
        <form action="" id="form_login">
            <div id="Contenerdor_log_in_y_registro">
            <label for="correo_login">
                Correo electronico
            </label>
            <input type="email" id="correo_login">
            <label for="contrasena_login">
                Contraseña
            </label>
            <input type="password" id="contrasena_login">
            <input type="submit" value="Iniciar sesion">
            <div id="mensaje_login"></div>
            <a id="link_nav" href="Sign_in.html">
                ¿No tienes cuenta? registrate
            </a>
            </div>
        </form>
<script src="login.js"></script>
</body>
</html>
